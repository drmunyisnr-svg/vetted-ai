<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vetted AI // Universal Telemetry Portal</title>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: monospace;
            padding: 40px 16px;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 80vh;
        }
        .dashboard-container {
            border: 1px solid #2c2c2e;
            padding: 32px;
            border-radius: 12px;
            background: #1c1c1e;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
        }
        h1 {
            color: #30d158;
            border-bottom: 1px dashed #2c2c2e;
            padding-bottom: 12px;
            margin-top: 0;
            font-size: 22px;
            letter-spacing: 1.5px;
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-top: 20px;
        }
        .card {
            background: #000000;
            border: 1px solid #2c2c2e;
            padding: 16px;
            border-radius: 6px;
        }
        .label {
            color: #8e8e93;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .value {
            font-size: 28px;
            font-weight: bold;
            margin-top: 6px;
        }
        .neon-green { color: #30d158; }
        .neon-red { color: #ff453a; }
        .button-row {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 24px;
        }
        .btn {
            border: none;
            padding: 12px;
            font-family: monospace;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            border-radius: 6px;
            text-align: center;
            text-decoration: none;
            transition: background 0.2s ease;
        }
        .primary-btn {
            background: #30d158;
            color: #000000;
        }
        .primary-btn:hover {
            background: #28b84b;
        }
        .secondary-btn {
            background: #2c2c2e;
            color: #ffffff;
            border: 1px solid #48484a;
        }
        .secondary-btn:hover {
            background: #3a3a3c;
        }
    </style>
</head>
<body>

<div class="dashboard-container">
    <h1>VETTED AI // PORTAL</h1>
    <p style="margin: 6px 0 0 0; font-size: 11px; color: #8e8e93;">Universal anti-scam extension download &amp; metric hub.</p>
    
    <div class="grid">
        <div class="card">
            <div class="label">Local Impressions</div>
            <div id="log-traffic" class="value neon-green">0</div>
        </div>
        <div class="card">
            <div class="label">Max Risk Delta</div>
            <div id="log-risk" class="value neon-red">0%</div>
        </div>
    </div>

    <div class="button-row">
        <a href="vetted-ai-extension.zip.zip" download class="btn primary-btn">
            📥 Download Vetted AI Extension (.zip)
        </a>
        <button class="btn secondary-btn" id="sync-btn" type="button">Sync Telemetry Data</button>
        <button class="btn secondary-btn" id="export-btn" type="button">Export Traffic Ledger</button>
    </div>
</div>

<script src="dashboard.js"></script>

</body>
</html>
